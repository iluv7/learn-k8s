# 敏感配置：Deployment 的 envFrom.secretRef 按名字引用。
# stringData 接受明文字符串；Secret 不是天然加密的保险箱。
# 此处仅保留演示值，真实凭据不要提交到代码仓库。
# 仅示例凭据；真实密码不要提交到代码仓库。
apiVersion: v1
kind: Secret
metadata:
  name: java-secret
  namespace: learn
type: Opaque # 通用键值形式的 Secret。
stringData:
  DB_USERNAME: "app"
  DB_PASSWORD: "replace-me"
